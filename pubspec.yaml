name: trackerapp
description: A new Flutter project.

# Prevents accidental publishing to pub.dev
publish_to: 'none'

# App version (format: major.minor.patch+build)
version: 1.0.9+9

# Dart SDK version constraints
environment:
  sdk: '>=3.1.3 <3.13.5'

dependencies:
  flutter:
    sdk: flutter

  # Core Flutter UI and platform packages
  cupertino_icons: ^1.0.8
  google_maps_flutter: ^2.13.1
  provider: ^6.1.5+1
  http: ^1.5.0
  responsive_sizer: ^3.3.1
  flutter_svg: ^2.2.1
  shared_preferences: ^2.5.3
  firebase_core: ^4.2.0
  firebase_messaging: ^16.0.3
  flutter_local_notifications: ^19.5.0
  sliding_up_panel: ^2.0.0+1
  syncfusion_flutter_gauges: ^31.2.3
  fl_chart: ^1.1.1
  motion_tab_bar_v2: ^0.4.0
  flutter_map: ^6.1.0
  latlong2: ^0.9.1
  cached_network_image: ^3.4.1
  dropdown_button2: ^2.3.9
  flutter_spinkit: ^5.2.2
  shimmer: ^3.0.0
  syncfusion_flutter_charts: ^31.2.12
  intl: ^0.20.2
  share_plus: ^12.0.1
  syncfusion_flutter_pdfviewer: ^31.2.18
  font_awesome_flutter: ^10.12.0
  url_launcher: ^6.3.2
  geolocator: ^13.0.2
  timezone: ^0.10.1
  flutter_timezone: ^4.1.1
  image_picker: ^1.2.0
  flutter_tts: ^4.2.3




dev_dependencies:
  flutter_test:
    sdk: flutter
  # Recommended linter rules
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true

  # Image assets folder
  assets:
    - assets/images/
    - assets/images/vehicle/
    - assets/svgs/
    - assets/map_styles/
    - assets/sound/
  fonts:
    - family: Almarena
      fonts:
        - asset: assets/fonts/AlmarenaRegular.ttf
          weight: 400
        - asset: assets/fonts/AlmarenaBold.otf
          weight: 700
    - family: Limelight
      fonts:
        - asset: assets/fonts/Limelight.ttf

# -------------------------------
# Note:
# Previously used package flutter_launcher_icons has been removed.
# If you wish to regenerate app icons, do so manually or use another tool.
# -------------------------------
