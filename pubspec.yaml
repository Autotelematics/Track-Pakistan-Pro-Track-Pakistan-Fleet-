name: trackerapp
description: A new Flutter project.

# Prevents accidental publishing to pub.dev
publish_to: 'none'

# App version (format: major.minor.patch+build)
version: 1.0.2+39

# Dart SDK version constraints
environment:
  sdk: '>=3.1.3 <3.13.5'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # Core Flutter UI and platform packages
  cupertino_icons: ^1.0.8
  google_maps_flutter: ^2.17.1
  google_maps_flutter_ios_sdk9: ^2.18.6
  provider: ^6.1.5+1
  http: ^1.6.0
  responsive_sizer: ^3.3.1
  flutter_svg: ^2.3.0
  shared_preferences: ^2.5.5
  firebase_core: ^4.11.0
  firebase_messaging: ^16.4.1
  flutter_local_notifications: ^22.0.1
  sliding_up_panel: ^2.0.0+1
  syncfusion_flutter_gauges: ^33.2.15
  fl_chart: ^1.2.0
  motion_tab_bar_v2: ^0.4.0
  flutter_map: ^8.3.0
  latlong2: ^0.9.1
  cached_network_image: ^3.4.1
  dropdown_button2: ^3.1.0
  flutter_spinkit: ^5.2.2
  shimmer: ^3.0.0
  syncfusion_flutter_charts: ^33.2.15
  intl: ^0.20.2
  share_plus: ^13.2.0
  pdfrx: ^2.4.4
  font_awesome_flutter: ^11.0.0
  url_launcher: ^6.3.2
  geolocator: ^14.0.3
  timezone: ^0.11.1
  flutter_timezone: ^5.1.0
  image_picker: ^1.2.2
  flutter_tts:
    path: third_party/flutter_tts




dev_dependencies:
  flutter_test:
    sdk: flutter
  # Recommended linter rules
  flutter_lints: ^5.0.0

flutter:
  generate: true
  uses-material-design: true

  # Image assets folder
  assets:
    - assets/images/
    - assets/images/vehicle/
    - assets/svgs/
    - assets/map_styles/
    - assets/sound/
  fonts:
    - family: Almarena
      fonts:
        - asset: assets/fonts/AlmarenaRegular.ttf
          weight: 400
        - asset: assets/fonts/AlmarenaBold.otf
          weight: 700
    - family: Limelight
      fonts:
        - asset: assets/fonts/Limelight.ttf

# -------------------------------
# Note:
# Previously used package flutter_launcher_icons has been removed.
# If you wish to regenerate app icons, do so manually or use another tool.
# -------------------------------
